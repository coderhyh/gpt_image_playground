services:
  image-playground-shunfeng:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: image-playground-shunfeng
    container_name: image-playground-shunfeng
    ports:
      - "7767:80"
    environment:
      API_KEY: ${API_KEY}
      # 上游 API 地址，不配置默认 https://www.right.codes（Right Code 同步画图接口）
      API_PROXY_URL: ${API_PROXY_URL:-https://www.right.codes}
      # PackyAPI 用量查询（可选）：系统访问令牌 + 用户 ID，不配则右上角不显示额度
      PACKY_ACCESS_TOKEN: ${PACKY_ACCESS_TOKEN:-}
      PACKY_USER_ID: ${PACKY_USER_ID:-}
    restart: unless-stopped
