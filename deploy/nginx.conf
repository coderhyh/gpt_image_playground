server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BEGIN USAGE PROXY
    # 用量查询代理：前端请求同源 /usage-proxy/...，由 Nginx 转发到 PackyAPI，
    # 在服务端注入系统访问令牌和用户 ID（敏感信息不暴露给前端）。
    location /usage-proxy/ {
        limit_except GET OPTIONS {
            deny all;
        }

        if ($uri = "/usage-proxy/") {
            return 403 "Forbidden: Usage Proxy path required";
        }

        proxy_set_header Authorization "Bearer ${PACKY_ACCESS_TOKEN}";
        proxy_set_header New-Api-User "${PACKY_USER_ID}";
        proxy_pass https://www.packyapi.ai/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    # END USAGE PROXY

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
